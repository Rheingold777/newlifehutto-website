name: Deploy approved Cloudflare release

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: newlifehutto-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify exact approved artifact
        run: |
          python scripts/package-cloudflare.py --out output/release
          python scripts/verify-approved-release.py --package output/release
          node --test scripts/cloudflare-routing.test.mjs
      - name: Preserve release artifact
        uses: actions/upload-artifact@v4
        with:
          name: newlifehutto-release-${{ github.sha }}
          path: |
            output/release/deploy.zip
            output/release/manifest.json
            output/release/ROLLBACK.md
      - name: Deploy generated directory to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.85.0 pages deploy output/release/deploy --project-name=newlifehutto --branch=main --commit-hash=${{ github.sha }}
